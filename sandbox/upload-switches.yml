      # Sandbox switches fail_upload and hang_upload (TS-S16), inserted by publish-public.sh.
      - name: sandbox upload switches
        if: always()
        timeout-minutes: 5
        run: |
          if jq -e '.hang_upload == true' sandbox.json > /dev/null; then
            echo "hang_upload: sleeping past this step's timeout"
            sleep infinity
          fi
          if jq -e '.fail_upload == true' sandbox.json > /dev/null; then
            echo "fail_upload: deleting the CTRF reports and timings.json so no artifact is uploaded"
            find . -path '*/TestResults/*.ctrf.json' -delete
            rm -f timings.json
            exit 1
          fi

      # Sandbox switch hang_upload_forever (TS-S16 (h)): a step with no timeout-minutes that
      # never ends, so the job outlives the tests and only the job's own timeout, or Main
      # Watcher's cancel, can end it. The marker step has already run, so the outcome table
      # still sees a finished test.
      - name: sandbox upload hang
        if: always()
        run: |
          if jq -e '.hang_upload_forever == true' sandbox.json > /dev/null; then
            echo "hang_upload_forever: this step never ends"
            sleep infinity
          fi
