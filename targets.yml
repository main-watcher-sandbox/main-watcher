# Validation of MainWatcher#26: the onboarding dry run and the hand-made lock workflow.
# sample-target is listed but NOT enabled, which is the state an entry has while it is being
# onboarded: the dry run accepts it, and no cycle can run against it.
lock_lease: 10
targets:
  - repo: main-watcher-sandbox/sample-target
    test_command: dotnet test --no-restore
    results_glob: '**/TestResults/*.ctrf.json'
    timeout: 30
    poll_interval: 1
    notify: [pat-actium]
    enabled: false
