# A 10-minute lock_lease, so a lapse takes minutes rather than four hours (TS-S7).
lock_lease: 10
targets:
  - repo: main-watcher-sandbox/sample-target
    test_command: dotnet test --no-restore
    results_glob: '**/TestResults/*.ctrf.json'
    timeout: 30
    poll_interval: 1
    notify: [pat-actium]
    enabled: true
