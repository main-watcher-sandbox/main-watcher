# The scenario suite's target pool, written by sandbox/scenarios (MainWatcher#25). A 10-minute lock_lease
# makes a lapse take minutes (TS-S7), and poll_interval 1 makes each scenario take minutes.
lock_lease: 10
targets:
  - repo: main-watcher-sandbox/sample-target
    test_command: dotnet test --no-restore
    results_glob: '**/TestResults/*.ctrf.json'
    timeout: 30
    poll_interval: 1
    notify: [main-watcher-sandbox/sandbox-owners]
    enabled: true
  - repo: main-watcher-sandbox/sample-target-10
