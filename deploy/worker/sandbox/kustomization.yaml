# The scenario-test worker in the sandbox namespace, watching main-watcher-sandbox (TS-001 §3).
# Apply with: kubectl apply -k deploy/worker/sandbox
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: main-watcher-sandbox
resources:
  - ../base
images:
  # Built locally: docker build -f src/MainWatcher.Worker/Dockerfile -t main-watcher-worker:dev .
  - name: main-watcher-worker
    newName: main-watcher-worker
    newTag: dev
patches:
  - target:
      kind: Deployment
      name: trigger-worker
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
configMapGenerator:
  - name: trigger-worker
    literals:
      - MW_WATCHER_REPO=main-watcher-sandbox/main-watcher
      - MW_MAIN_WATCHER_APP_ID=4966469
      - MW_OBSERVER_APP_ID=4966600
      - MW_DOORBELL_APP_ID=4966655
      # The sandbox main-watcher App's login; the worker's default is the production App's.
      - MW_BOT_LOGIN=main-watcher[bot]
      - MW_CHECK_PERIOD_SECONDS=60
      # The scenario suite shortens the ADR-013 queue deadline for one target only (TS-S16 (g)); watch.yml reads the same
      # setting from the replica's MW_QUEUE_DEADLINE_MINUTES variable, which the suite sets. See SandboxSwitch.
      - MW_QUEUE_DEADLINE_MINUTES=main-watcher-sandbox/sample-target-10=10
