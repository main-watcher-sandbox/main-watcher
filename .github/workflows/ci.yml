# Watcher repo CI: unit tests and workflow lint on every PR (TS-001 §5).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - run: dotnet test

  # Every targets.yml entry, read by the parser the cycles use, so an onboarding pull request fails here rather than an
  # hour later in a sweep (docs/onboarding.md). The unit tests parse the committed file too; this job is what an
  # onboarding pull request reads, and says what each entry was understood to mean.
  targets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - run: dotnet build src/MainWatcher.Watcher --configuration Release

      - name: Validate targets.yml
        run: dotnet src/MainWatcher.Watcher/bin/Release/net10.0/MainWatcher.Watcher.dll --check-targets

  # The trigger worker's container: it builds, fails fast without configuration and answers /healthz (#14).
  worker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the worker image
        run: docker build --file src/MainWatcher.Worker/Dockerfile --tag main-watcher-worker:ci .

      - name: Smoke test
        run: src/MainWatcher.Worker/smoke-test.sh main-watcher-worker:ci

  # A new ctrf-io/github-test-reporter pin can change how the job summary reads history and ranks the slowest tests, so it
  # needs TS-S13 to have passed on the pull request's own commit (TS-001 §4, ADR-018): the scenario-suite/ts-s13 status,
  # which sandbox/run-scenarios.sh --only TS-S13 posts. Re-run this job once it has.
  reporter-pin:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          FILE: .github/workflows/run-integration-tests.yml
        run: |
          set -euo pipefail
          pin() { gh api "repos/$GITHUB_REPOSITORY/contents/$FILE?ref=$1" --jq .content | base64 -d | grep -o 'ctrf-io/github-test-reporter@[0-9a-f]*' || true; }
          before="$(pin "$BASE")"
          after="$(pin "$HEAD")"
          if [ "$before" = "$after" ]; then
            echo "The reporter pin is unchanged ($after)."
            exit 0
          fi
          state="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD/statuses?per_page=100" \
            --jq '[.[] | select(.context == "scenario-suite/ts-s13")][0].state // "missing"')"
          if [ "$state" != success ]; then
            echo "::error::The reporter pin changes ($before -> $after), so TS-S13 must pass on $HEAD first (scenario-suite/ts-s13: $state). Run: sandbox/run-scenarios.sh --only TS-S13, then re-run this job."
            exit 1
          fi
          echo "The reporter pin changes ($before -> $after), and TS-S13 passed on $HEAD."

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" actionlint

      # Workflows in this repo, the templates copied into targets, and the sandbox target's workflows.
      - name: Lint workflows
        run: |
          shopt -s nullglob
          ./actionlint -color .github/workflows/*.yml templates/*.yml sandbox/sample-target/.github/workflows/*.yml
