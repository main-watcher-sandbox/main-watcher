# Lists the repositories the main-watcher App is installed on, for the R-11 review (TS-001 §6, TS-S8).
# sandbox/ts-s8-credential-scope.sh dispatches it and compares the list with targets.yml: the App's key exists only
# in the reporter environment, so nothing outside a workflow here can ask GitHub for its installation. It checks out
# and runs no code, and its token can read repository metadata only.
name: app-installations

on:
  workflow_dispatch:

permissions: {}

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: reporter
    steps:
      # No repositories: the token covers the whole installation, which is what is being listed.
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.MAIN_WATCHER_APP_ID }}
          private-key: ${{ secrets.MAIN_WATCHER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-metadata: read

      - name: List the installation
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          mkdir installation
          gh api '/installation/repositories?per_page=1' --jq .repository_selection > installation/selection.txt
          gh api --paginate '/installation/repositories?per_page=100' --jq '.repositories[].full_name' | sort > installation/repositories.txt
          {
            echo "repository_selection: $(cat installation/selection.txt)"
            echo
            sed 's/^/- /' installation/repositories.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-watcher-installation
          path: installation/
          retention-days: 1
